(async()=>{'use strict';
const app=document.getElementById('app');

const data=JSON.parse(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
const chapters=data.chapters,images=data.images,byN=Object.fromEntries(chapters.map(c=>[c.n,c]));
const totals={lessons:chapters.reduce((s,c)=>s+c.lessons.length,0),exercises:chapters.reduce((s,c)=>s+c.lessons.reduce((t,l)=>t+l.exercises.length,0),0),questions:chapters.reduce((s,c)=>s+c.questions.length,0)};
let query='',page=0,filter='all',recent=null,marks=[];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).toLowerCase().trim();
const footer=()=>'<footer>إعداد وتصميم أحمد بن خميس. مرجع للحلول المحفوظة، بدون تسجيل دخول أو حل آلي. طابق نص السؤال قبل النسخ؛ ترتيب الأسئلة والاختيارات ممكن يختلف. بيانات الأرشيف: ٢١ نوفمبر ٢٠٢٦. بعض الأسئلة مختصرة في الأرشيف؛ طابق البرنامج والاختيارات في حسابك.</footer>';
const btn=(label,action,cls='',disabled=false)=>`<button type="button" class="btn ${cls}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;
const codeRE=/^\s*(let |const |var |for\s*\(|if\s*\(|else|console\.|function |return |[{}]|<[/a-z]|[a-zA-Z_][a-zA-Z0-9_]*\s*[=(.])/;
const prompt=t=>'<div class="prompt">'+String(t).replace(/\n{3,}/g,'\n\n').split('\n').map(l=>`<div dir="${codeRE.test(l)?'ltr':'rtl'}">${esc(l)||' '}</div>`).join('')+'</div>';
const hl=t=>{const re=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(let|const|var|function|return|if|else|for|while|of|in|new|typeof|switch|case|break|continue|true|false|null|undefined|do|this)\b|(\b\d+(?:\.\d+)?\b)/g;let out='',at=0,m;while((m=re.exec(t))){out+=esc(t.slice(at,m.index))+`<span class="${m[1]?'comment':m[2]?'str':m[3]?'kw':'n'}">${esc(m[0])}</span>`;at=m.index+m[0].length}return out+esc(t.slice(at))};
let copies=[];
const copy=(t,label='انسخ الحل')=>{const i=copies.push(t)-1;return btn(label,'copy:'+i,'primary')};
const code=(t,label='الحل',allow=true)=>`<div class="code-wrap"><div class="copybar"><span class="meta">${label}</span>${allow?copy(t):''}</div><pre class="code" dir="ltr"><code>${hl(String(t||''))}</code></pre></div>`;
const img=k=>images[k]?`<figure class="diagram"><img src="${images[k]}" alt="الرسم المرجعي المرتبط بالسؤال"><figcaption>الرسم المرجعي من السؤال على منصة كيريو</figcaption></figure>`:'';
const route=()=>{const v=location.hash.slice(1).split('/');const c=byN[+v[1]];if(v[0]!=='c'||!c)return {s:'home'};if(v[2]==='l'&&c.lessons[+v[3]-1]){const l=c.lessons[+v[3]-1];if(v[4]==='e'&&l.exercises[+v[5]-1])return{s:'ex',c,l,e:l.exercises[+v[5]-1],li:+v[3]-1,ei:+v[5]-1};return{s:'lesson',c,l,li:+v[3]-1}}if(v[2]==='q'&&c.questions[+v[3]-1])return{s:'q',c,q:c.questions[+v[3]-1],qi:+v[3]-1};if(v[2]==='review')return{s:'review',c};return{s:'chapter',c}};
const home=()=>go('');const go=p=>{if(location.hash.slice(1)===p)render();else location.hash=p};
const path=v=>v.s==='ex'?`c/${v.c.n}/l/${v.li+1}/e/${v.ei+1}`:v.s==='q'?`c/${v.c.n}/q/${v.qi+1}`:'';
const top=(title,sub,parent)=>`<header class="bar">${btn('› رجوع','go:'+parent)}<div class="titles"><h2>${esc(title)}</h2><div class="meta">${esc(sub)}</div></div>${btn('الفصول','home')}</header>`;
const row=(title,meta,p,extra='')=>`<button type="button" class="row ${extra}" data-action="go:${p}"><span><span class="name">${esc(title)}</span><span class="meta">${esc(meta)}</span></span><span class="chev" aria-hidden="true">‹</span></button>`;
const tools=v=>{const p=path(v),saved=marks.some(m=>m.path===p);return `<div class="tools">${btn(saved?'★ محفوظ':'☆ احفظ للمراجعة','mark')}${btn('انسخ رابط السؤال','link')}</div>`};
function save(){try{localStorage.setItem('qureo-recent-v2',JSON.stringify(recent));localStorage.setItem('qureo-marks-v2',JSON.stringify(marks))}catch{}}
function homeResults(){const q=norm(query);const all=chapters.filter(c=>norm(c.n+' '+c.title+' '+c.lessons.map(l=>l.title).join(' ')).includes(q));const cur=Math.min(page,Math.max(0,Math.ceil(all.length/6)-1));page=cur;return `<div class="grid">${all.slice(cur*6,cur*6+6).map(c=>`<button type="button" class="chapter" data-action="go:c/${c.n}"><span class="num">${c.n}</span><span class="name">${esc(c.title)}</span><span class="meta">${c.lessons.length} دروس · ${c.lessons.reduce((t,l)=>t+l.exercises.length,0)} تمرين</span></button>`).join('')}</div>${!all.length?'<p class="empty">مفيش فصل مطابق. جرّب رقمه من ١ لحد ٤٢ أو اسم الموضوع.</p>':''}<div class="pager">${btn('السابق','prev','',cur===0)}<span class="meta">${all.length?cur*6+1:0}–${Math.min(all.length,cur*6+6)} من ${all.length}</span>${btn('التالي','next','',cur>=Math.ceil(all.length/6)-1)}</div>`}
function render(){copies=[];const v=route();let html='';if(v.s==='home'){
html=`<img class="hero" src="ZC66HIXH.png" alt="رسم توضيحي لأقواس البرمجة"><h1>حلول كيريو</h1><p class="credit">٤٢ فصل · إعداد وتصميم أحمد بن خميس</p><p class="counts">${totals.lessons} درس · ${totals.exercises} تمرين · ${totals.questions} سؤال مراجعة واختبار</p><label class="label" for="search">اكتب رقم الفصل أو اسم الموضوع</label><div class="search"><input id="search" type="search" value="${esc(query)}" placeholder="مثال: ٤٢، while، المصفوفات" autocomplete="off" enterkeyhint="search" aria-label="ابحث برقم الفصل أو اسم الموضوع">${btn('المحفوظات'+(marks.length?' '+marks.length:''),'saved')}</div><div class="ranges" aria-label="انتقل لمجموعة فصول">${[0,1,2,3,4,5,6].map(n=>`<button type="button" dir="ltr" class="range ${page===n&&!query?'active':''}" data-action="range:${n}">${n*6+1}–${Math.min(42,n*6+6)}</button>`).join('')}</div><div id="results">${homeResults()}</div>${recent?row('كمّل من آخر سؤال',recent.label,recent.path):''}${footer()}`;
}else if(v.s==='chapter'){const c=v.c;html=top('الفصل '+c.n+': '+c.title,c.lessons.length+' دروس · '+c.questions.length+' أسئلة مراجعة','');html+=c.lessons.map((l,i)=>row('الدرس '+l.n+': '+l.title,l.exercises.length?l.exercises.length+' تمارين':'درس مفاهيم',`c/${c.n}/l/${i+1}`)).join('');html+=row(c.assessment||'مراجعة الفصل','الإجابات بالترتيب · '+c.questions.length+' أسئلة',`c/${c.n}/review`,'review');
}else if(v.s==='lesson'){const {c,l,li}=v;html=top('الدرس '+l.n+': '+l.title,'الفصل '+c.n+': '+c.title,`c/${c.n}`);if(l.note)html+=`<div class="notice">${esc(l.note)}</div>`;if(!l.exercises.length)html+='<div class="card">درس مفاهيم من غير تمارين كود مرقمة.</div>';html+=l.exercises.map((e,i)=>row('التدريب '+e.n,e.runOnly?(e.kind==='fix'?'تحديد خطأ':'تشغيل فقط'):e.blanks.length?'ملء فراغات':'كتابة كود',`c/${c.n}/l/${li+1}/e/${i+1}`)).join('');html+=`<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">افتح الدرس على كيريو ↗</a>`;
}else if(v.s==='review'){const c=v.c;html=top(c.assessment||'مراجعة الفصل','الفصل '+c.n+' · '+c.questions.length+' أسئلة',`c/${c.n}`);html+=c.questions.map((q,i)=>row('السؤال '+q.n,q.answer?'إجابة اختيار':'كود',`c/${c.n}/q/${i+1}`)).join('');
}else{const {c}=v,isEx=v.s==='ex',e=isEx?v.e:v.q;html=top((isEx?'التدريب ':'السؤال ')+e.n+' من '+(isEx?v.l.exercises.length:c.questions.length),'الفصل '+c.n+' · '+(isEx?v.l.title:(c.assessment||'مراجعة')),isEx?`c/${c.n}/l/${v.li+1}`:`c/${c.n}/review`);html+=`<div class="card"><span class="label">المطلوب</span>${prompt(e.prompt)}${img(isEx?`${c.n}-${v.l.n}-${e.n}`:`${c.n}-${e.n}`)}</div>`;if(e.note)html+=`<div class="notice">${esc(e.note)}</div>`;if(isEx){if(e.runOnly){html+=`<div class="notice">${e.kind==='fix'?'المطلوب تحدد الخطأ في الكود. اقرأ رسالة الخطأ في وحدة التحكم. النسخة المحفوظة تحت هي كود التمرين، مش حل جاهز للنسخ.':'هنا مش محتاج تنسخ أو تعدّل الكود. اضغط «تشغيل الكود» على كيريو وشوف النتيجة في وحدة التحكم.'}</div>`+code(e.code,'الكود كما ظهر في التمرين',false)}else{if(e.blanks.length)html+=e.blanks.map((b,i)=>`<div class="blank"><div class="copybar"><span class="meta">الفراغ ${i+1}</span>${copy(b,'انسخ الفراغ')}</div><pre class="code">${hl(b)}</pre></div>`).join('');html+=code(e.code,e.blanks.length?'الحل كاملًا بعد ملء الفراغات':'الحل')}}else if(e.answer){html+=`<div class="copybar"><span class="meta">الإجابة</span>${copy(e.answer,'انسخ الإجابة')}</div><div class="answer" dir="${/[؀-ۿ]/.test(e.answer)?'rtl':'ltr'}">${esc(e.answer)}</div>`;if(e.code)html+=code(e.code,'الكود المرتبط بالسؤال')}else html+=code(e.code);html+='<p class="meta">طابق نص السؤال قبل النسخ؛ ترتيب الاختيارات ممكن يختلف.</p>'+tools(v);const n=isEx?v.ei:v.qi,total=isEx?v.l.exercises.length:c.questions.length,prefix=isEx?`c/${c.n}/l/${v.li+1}/e/`:`c/${c.n}/q/`;html+=`<div class="pager">${btn('السابق','go:'+prefix+n,'',n===0)}<span class="meta" dir="ltr">${n+1} / ${total}</span>${btn('التالي','go:'+prefix+(n+2),'',n===total-1)}</div>`;recent={path:path(v),label:`الفصل ${c.n} · ${isEx?'التدريب':'السؤال'} ${e.n}`};save()}
app.innerHTML='<div class="screen">'+html+'</div>';window.scrollTo(0,0);
}
let toastTimer;function toast(t){document.getElementById('toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',2400)}
async function copyText(text,button){let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();try{ok=document.execCommand('copy')}catch{}t.remove()}if(ok){if(button){const old=button.textContent;button.textContent='تم النسخ ✓';setTimeout(()=>{if(button.isConnected)button.textContent=old},1800)}toast('تم النسخ')}else toast('النسخ مش متاح في المتصفح ده. حدّد النص وانسخه يدويًا.')}
app.addEventListener('input',event=>{if(event.target.id==='search'){query=event.target.value;page=0;document.getElementById('results').innerHTML=homeResults();document.querySelectorAll('.range').forEach(e=>e.classList.remove('active'))}});
app.addEventListener('click',async event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='home')home();else if(a.startsWith('go:'))go(a.slice(3));else if(a==='prev'||a==='next'){page+=a==='next'?1:-1;render()}else if(a.startsWith('range:')){page=+a.slice(6);query='';render()}else if(a.startsWith('copy:'))await copyText(copies[+a.slice(5)],b);else if(a==='link')await copyText(location.href,b);else if(a==='mark'){const v=route(),p=path(v),i=marks.findIndex(m=>m.path===p);if(i>=0)marks.splice(i,1);else marks.push({path:p,label:recent.label});save();render();toast(i>=0?'اتشال من المحفوظات':'اتحفظ على الجهاز ده')}else if(a==='saved'){copies=[];app.innerHTML='<div class="screen">'+top('المحفوظات','محفوظة على الجهاز ده فقط','')+(marks.length?marks.map(m=>row(m.label,'افتح الحل',m.path)).join(''):'<p class="empty">لسه مفيش أسئلة محفوظة. افتح أي سؤال واضغط «احفظ للمراجعة».</p>')+'</div>';window.scrollTo(0,0)}});
window.addEventListener('hashchange',render);render();
window.qureoAudit={chapters:chapters.length,...totals,images:Object.keys(images).length};
}catch(e){app.innerHTML='<h1>حلول كيريو</h1><p>المتصفح مش قادر يفتح الأرشيف. جرّب أحدث إصدار من Chrome أو Safari.</p><button class="btn" onclick="location.reload()">حاول تاني</button>'}
})();
</script></body></html>
